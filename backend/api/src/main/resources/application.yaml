spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/schedule_db
    username: postgres
    password: [PASSWORD]
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: false

server:
  port: 8080
